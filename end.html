<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Thank You</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f5f7fa;

      color: #222;

      min-height: 100vh;

    }


    .page-container {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 30px 20px;

    }


    .content-card {

      width: 100%;

      max-width: 700px;

      background: #ffffff;

      border-radius: 14px;

      padding: 50px 45px;

      text-align: center;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.08);

    }


    /* ============================= */
    /* ICON */
    /* ============================= */

    .check-icon {

      width: 70px;

      height: 70px;

      margin: 0 auto 25px;

      border-radius: 50%;

      background: #222;

      color: #fff;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 34px;

      font-weight: 600;

    }


    /* ============================= */
    /* TITLE */
    /* ============================= */

    .page-title {

      margin: 0 0 18px;

      font-size: 32px;

      line-height: 1.3;

      font-weight: 700;

    }


    /* ============================= */
    /* TEXT */
    /* ============================= */

    .page-description {

      margin: 0 auto;

      max-width: 560px;

      font-size: 16px;

      line-height: 1.7;

      color: #555;

    }


    .completion-message {

      margin-top: 25px;

      padding: 16px 18px;

      background: #f7f7f7;

      border-radius: 8px;

      font-size: 14px;

      line-height: 1.6;

      color: #555;

    }


    /* ============================= */
    /* MOBILE */
    /* ============================= */

    @media (max-width: 600px) {

      .content-card {

        padding: 40px 25px;

      }


      .page-title {

        font-size: 27px;

      }


      .page-description {

        font-size: 15px;

      }

    }

  </style>

</head>


<body>


  <div class="page-container">


    <div class="content-card">


      <!-- ============================= -->
      <!-- CHECK ICON -->
      <!-- ============================= -->

      <div class="check-icon">

        ✓

      </div>


      <!-- ============================= -->
      <!-- TITLE -->
      <!-- ============================= -->

      <h1 class="page-title">

        Thank You!

      </h1>


      <!-- ============================= -->
      <!-- DESCRIPTION -->
      <!-- ============================= -->

      <p class="page-description">

        Thank you for taking part in this study.

        <br><br>

        Your responses have been recorded
        successfully.

      </p>


      <!-- ============================= -->
      <!-- COMPLETION MESSAGE -->
      <!-- ============================= -->

      <div class="completion-message">

        You have now completed the study.

        <br>

        You may close this window.

      </div>


    </div>


  </div>


  <!-- ============================= -->
  <!-- JAVASCRIPT -->
  <!-- ============================= -->

  <script>


    // =====================================
    // MARK STUDY AS COMPLETED
    // =====================================

    localStorage.setItem(
      "pilot_completed",
      "yes"
    );


    localStorage.setItem(
      "pilot_completed_timestamp",
      new Date().toISOString()
    );


    // =====================================
    // BLOCK BACK NAVIGATION
    // =====================================

    history.pushState(
      null,
      null,
      location.href
    );


    window.onpopstate =
      function () {

        history.go(1);

      };


  </script>


</body>

</html>
